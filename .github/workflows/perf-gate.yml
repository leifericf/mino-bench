name: perf-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record:
        description: "Record a fresh baseline instead of running the gate"
        type: boolean
        default: false

jobs:
  perf-gate:
    name: perf-gate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.record }}
    runs-on: ubuntu-22.04
    # GitHub-hosted runners are CPU-noisy and the ubuntu-22.04 image
    # itself drifts under the pinned baseline, so the gate is
    # informational here. Local runs are the authoritative signal;
    # rebaseline via the manual record-baseline job when needed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compiler version
        run: cc --version

      - name: Bootstrap mino
        # The submodule Makefile generates the bundled-source headers and
        # links mino (with its JIT and include flags) in one step, so the
        # bootstrap tracks the C tree as it moves instead of drifting from
        # a hand-maintained source and include list.
        run: cd mino && make

      - name: Build bench binaries
        run: ./mino/mino task build

      - name: Run perf gate
        run: ./mino/mino task perf-gate

  record-baseline:
    name: record baseline
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.record }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compiler version
        run: cc --version

      - name: Bootstrap mino
        run: cd mino && make

      - name: Build bench binaries
        run: ./mino/mino task build

      - name: Record baseline
        env:
          MINO_PERF_GATE_RECORD: "1"
        run: ./mino/mino task perf-gate

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf_baseline
          path: baselines/perf_baseline.edn
          if-no-files-found: error
          retention-days: 7
